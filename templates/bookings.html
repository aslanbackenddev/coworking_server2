<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Коворкинг — Мои брони</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="/static/images/logo.jpg" alt="Логотип" width="30" height="30">
            КОВОРКИНГ
        </div>
        <nav>
            <a href="/workspaces">Места</a>
            <a href="/">На главную</a>
        </nav>
    </header>
    <main class="list-page">
        <h1>Мои брони</h1>
        <div class="list" id="bookingList">
            <div class="item" data-id="1">
                <div class="info">
                    <span class="name">Место №1</span>
                    <span class="price">15.10 | 10–12</span>
                </div>
                <button class="btn-cancel" onclick="cancelBooking(1)">Отменить</button>
            </div>
            <div class="item" data-id="2">
                <div class="info">
                    <span class="name">Место №2</span>
                    <span class="price">16.10 | 14–16</span>
                </div>
                <button class="btn-cancel" onclick="cancelBooking(2)">Отменить</button>
            </div>
        </div>
    </main>
    <footer>© 2026 Коворкинг. Курсовой проект.</footer>

    <script>
        async function cancelBooking(bookingId) {
            if (!confirm('Вы уверены, что хотите отменить эту бронь?')) return;
            try {
                const response = await fetch(`/bookings/${bookingId}`, { method: 'DELETE' });
                if (response.ok) {
                    const item = document.querySelector(`.item[data-id="${bookingId}"]`);
                    if (item) item.remove();
                } else {
                    alert('Не удалось отменить бронь.');
                }
            } catch (error) {
                alert('Ошибка сервера.');
            }
        }
    </script>
</body>
</html>
