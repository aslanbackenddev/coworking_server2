<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Коворкинг — Вход</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="/static/images/logo.jpg" alt="Логотип" width="30" height="30">
            КОВОРКИНГ
        </div>
        <nav>
            <a href="/login" class="primary">Вход</a>
            <a href="/register">Регистрация</a>
        </nav>
    </header>
    <main>
        <div class="form-card">
            <h1>Вход</h1>
            <form>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" placeholder="example@mail.ru">
                </div>
                <div class="form-group">
                    <label>Пароль</label>
                    <input type="password" placeholder="••••••••">
                </div>
                <button type="submit" class="btn-submit">Войти</button>
            </form>
            <div class="form-footer">
                Нет аккаунта? <a href="/register">Регистрация</a>
            </div>
        </div>
    </main>
    <footer>© 2026 Коворкинг. Курсовой проект.</footer>
</body>
</html>
