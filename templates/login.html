<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Коворкинг — Вход</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #fafafa; color: #1a1a1a; min-height: 100vh;
            display: flex; flex-direction: column;
        }
        header {
            background: #ffffff; border-bottom: 1px solid #e5e5e5;
            padding: 20px 60px; display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 20px; font-weight: 700; letter-spacing: 2px; color: #111; }
        nav { display: flex; gap: 24px; }
        nav a { color: #444; text-decoration: none; font-size: 15px; font-weight: 500; padding: 8px 14px; border-radius: 6px; transition: all 0.15s ease; }
        nav a:hover { background: #f0f4ff; color: #2563eb; }
        nav a.primary { background: #2563eb; color: #ffffff; }
        nav a.primary:hover { background: #1d4ed8; color: #ffffff; }

        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 60px; }
        .form-card {
            background: #ffffff; padding: 48px; border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05); max-width: 480px; width: 100%;
        }
        .form-card h1 { font-size: 28px; font-weight: 700; margin-bottom: 32px; color: #111; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; font-size: 14px; font-weight: 500; color: #555; margin-bottom: 8px; }
        .form-group input {
            width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px;
            font-size: 15px; transition: border-color 0.15s ease;
        }
        .form-group input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1); }
        .btn-submit {
            width: 100%; background: #2563eb; color: #ffffff; border: none;
            padding: 14px; border-radius: 8px; font-size: 16px; font-weight: 500;
            cursor: pointer; transition: all 0.15s ease; margin-top: 10px;
        }
        .btn-submit:hover { background: #1d4ed8; transform: translateY(-1px); }
        .form-footer { margin-top: 24px; text-align: center; font-size: 14px; color: #666; }
        .form-footer a { color: #2563eb; text-decoration: none; font-weight: 500; }
        .form-footer a:hover { text-decoration: underline; }
        footer { padding: 24px 60px; text-align: center; color: #999; font-size: 13px; border-top: 1px solid #e5e5e5; background: #ffffff; }
    </style>
</head>
<body>
    <header>
        <div class="logo">
    <img src="/static/images/logo.jpg" alt="Логотип" width="30" height="30" style="vertical-align: middle; margin-right: 8px;">
    КОВОРКИНГ
</div>
        <nav>
            <a href="/login" class="primary">Вход</a>
            <a href="/register">Регистрация</a>
        </nav>
    </header>
    <main>
        <div class="form-card">
            <h1>Вход</h1>
            <form>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="example@mail.ru">
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" placeholder="••••••••">
                </div>
                <button type="submit" class="btn-submit">Войти</button>
            </form>
            <div class="form-footer">
                Нет аккаунта? <a href="/register">Регистрация</a>
            </div>
        </div>
    </main>
    <footer>© 2026 Коворкинг. Курсовой проект.</footer>
</body>
</html>
