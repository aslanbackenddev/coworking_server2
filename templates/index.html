<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Коворкинг — Главная</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: #fafafa; color: #1a1a1a; min-height: 100vh;
            display: flex; flex-direction: column;
        }
        header {
            background: #ffffff; border-bottom: 1px solid #e5e5e5;
            padding: 20px 60px; display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-size: 20px; font-weight: 700; letter-spacing: 2px; color: #111; }
        nav { display: flex; gap: 24px; }
        nav a {
            color: #444; text-decoration: none; font-size: 15px; font-weight: 500;
            padding: 8px 14px; border-radius: 6px; transition: all 0.15s ease;
        }
        nav a:hover { background: #f0f4ff; color: #2563eb; }
        nav a.primary { background: #2563eb; color: #ffffff; }
        nav a.primary:hover { background: #1d4ed8; color: #ffffff; }

        main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 80px 60px; }
        .hero { max-width: 640px; text-align: left; }
        .hero h1 { font-size: 44px; font-weight: 700; line-height: 1.2; margin-bottom: 16px; color: #111; }
        .hero p { font-size: 18px; color: #666; margin-bottom: 36px; line-height: 1.6; }
        .hero a.button {
            display: inline-block; background: #2563eb; color: #ffffff; text-decoration: none;
            font-size: 16px; font-weight: 500; padding: 14px 32px; border-radius: 8px;
            transition: all 0.15s ease;
        }
        .hero a.button:hover { background: #1d4ed8; transform: translateY(-1px); box-shadow: 0 6px 16px rgba(37, 99, 235, 0.25); }

        footer { padding: 24px 60px; text-align: center; color: #999; font-size: 13px; border-top: 1px solid #e5e5e5; background: #ffffff; }
    </style>
</head>
<body>
    <header>
        <div class="logo">
    <img src="/static/images/logo.jpg" alt="Логотип" width="30" height="30" style="vertical-align: middle; margin-right: 8px;">
    КОВОРКИНГ
</div>
        <nav>
            <a href="/login">Вход</a>
            <a href="/register" class="primary">Регистрация</a>
        </nav>
    </header>
    <main>
        <div class="hero">
            <h1>Рабочие места для всех</h1>
            <p>Уютные места, интернет, кофе — всё для продуктивной работы.</p>
            <a href="/workspaces" class="button">Посмотреть места</a>
        </div>
    </main>
    <footer>© 2026 Коворкинг. Курсовой проект.</footer>
</body>
</html>
