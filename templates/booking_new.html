<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Коворкинг — Бронирование</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="/static/images/logo.jpg" alt="Логотип" width="30" height="30">
            КОВОРКИНГ
        </div>
        <nav>
            <a href="/workspaces">Места</a>
            <a href="/">На главную</a>
        </nav>
    </header>
    <main>
        <div class="form-card">
            <h1>Бронирование</h1>
            <form>
                <div class="form-group">
                    <label>Дата</label>
                    <input type="date" value="2026-10-15">
                </div>
                <div class="form-group">
                    <label>Начало</label>
                    <input type="time" value="10:00">
                </div>
                <div class="form-group">
                    <label>Конец</label>
                    <input type="time" value="12:00">
                </div>
                <button type="submit" class="btn-submit">Забронировать</button>
            </form>
        </div>
    </main>
    <footer>© 2026 Коворкинг. Курсовой проект.</footer>
</body>
</html>
